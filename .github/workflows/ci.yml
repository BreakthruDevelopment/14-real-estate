name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://app:app@localhost:5432/app
      TEST_DATABASE_URL: postgres://app:app@localhost:5432/app
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      APP_URL: http://localhost:3000
      AI_PROVIDER: demo
      NEXT_TELEMETRY_DISABLED: "1"
      # Two agents for the smoke test (an admin grants the role in the live app; CI writes it directly).
      SMOKE_AGENT_EMAIL: smoke-agent@example.test
      SMOKE_AGENT_PASSWORD: ci-smoke-agent-pass-1
      SMOKE_AGENT2_EMAIL: smoke-agent2@example.test
      SMOKE_AGENT2_PASSWORD: ci-smoke-agent-pass-2
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Migrate
        run: pnpm db:migrate
      - name: Start the built app
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > app.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health && break; sleep 1; done
      - name: Seed the smoke agents
        run: |
          SEED_AGENT_EMAIL="$SMOKE_AGENT_EMAIL" SEED_AGENT_PASSWORD="$SMOKE_AGENT_PASSWORD" \
          SEED_AGENT2_EMAIL="$SMOKE_AGENT2_EMAIL" SEED_AGENT2_PASSWORD="$SMOKE_AGENT2_PASSWORD" \
          pnpm db:seed
      - name: End-to-end smoke test
        run: bash scripts/smoke.sh
      - name: App log on failure
        if: failure()
        run: tail -100 app.log || true

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          # Loaded into the local daemon so the sharp check below can actually run the image.
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # sharp's native binding is a per-platform optional dependency: this runner builds and tests on glibc,
      # while the image is node:22-alpine (musl). A green `pnpm test` on the host says nothing about whether the
      # deployed container can decode a photo, so the check runs inside the image that ships.
      - name: sharp loads and processes an image in the built image
        run: docker run --rm --workdir /app app:ci node -e "$(cat scripts/check-sharp.cjs)"

      # The memory gate (14.2, decision 2), inside the image that ships. sharp's peak RSS is mostly its
      # allocator's behaviour and the allocator comes with the base image, so a figure measured on this runner's
      # glibc does not describe node:22-alpine (musl). Same two limits the deployed replica runs under.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the benchmark harness
        run: |
          mkdir -p bench
          # The module, bundled, so no TypeScript loader is counted in the measurement. sharp stays external:
          # the image resolves its own musl binding from /app/node_modules. esbuild is a direct devDependency
          # for this: pnpm does not put a transitive package's binary on the path.
          pnpm exec esbuild src/lib/images/process.ts --bundle --platform=node --format=cjs --target=node22 \
            --external:sharp --alias:@=./src --alias:server-only=./test/server-only-stub.ts \
            --outfile=bench/process.bundle.cjs
          cp scripts/bench-images.cjs bench/
          # The worst allowed inputs. Generated here rather than in the container so the bytes are identical to
          # the ones the tests used.
          pnpm fixtures:images
      - name: Peak RSS inside the Alpine image, at 512 MiB / 0.25 vCPU
        run: |
          docker run --rm \
            --memory=512m --memory-swap=512m --cpus=0.25 \
            -v "$PWD/bench:/app/bench:ro" \
            -v "$PWD/test/fixtures/images/generated:/app/fixtures:ro" \
            --workdir /app app:ci node bench/bench-images.cjs
      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: false
          tags: app-migrate:ci
          cache-from: type=gha
